<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>運気上昇お茶会 | STAFF MENU</title>
<style>
  :root{
    --pink1:#fdeef1;
    --pink2:#fbdbe3;
    --gold:#c9a24a;
    --maroon:#8a2244;
    --text:#5a3a3a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
    background:linear-gradient(180deg,var(--pink1) 0%,var(--pink2) 100%);
    color:var(--text);
    display:flex;
    justify-content:center;
  }
  .app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    padding:28px 18px 40px;
    position:relative;
  }
  header.title{
    text-align:center;
    margin-bottom:22px;
  }
  header.title .badge{
    display:inline-block;
    font-size:12px;
    letter-spacing:.2em;
    color:var(--maroon);
    border-top:1px solid var(--gold);
    border-bottom:1px solid var(--gold);
    padding:4px 18px;
    margin-bottom:10px;
  }
  header.title h1{
    font-size:26px;
    margin:0 0 6px;
    color:var(--maroon);
    letter-spacing:.05em;
  }
  header.title p{
    margin:0;
    font-size:13px;
    color:#8a6b6b;
  }

  /* ---- staff list ---- */
  .list{
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .card{
    display:flex;
    align-items:center;
    gap:16px;
    background:#fffdfb;
    border:1px solid var(--gold);
    border-radius:18px;
    padding:12px 16px;
    cursor:pointer;
    box-shadow:0 2px 8px rgba(150,90,90,.08);
    transition:transform .15s ease;
  }
  .card:active{ transform:scale(.97); }
  .card img.portrait{
    width:64px;
    height:64px;
    border-radius:50%;
    border:2px solid var(--gold);
    object-fit:cover;
    flex-shrink:0;
  }
  .card .info{ flex:1; }
  .card .name{
    font-size:17px;
    font-weight:bold;
    color:var(--maroon);
    margin-bottom:4px;
  }
  .card .tag{
    display:inline-block;
    font-size:12px;
    background:var(--pink1);
    color:var(--maroon);
    border-radius:999px;
    padding:2px 10px;
  }
  .card .arrow{
    color:var(--gold);
    font-size:18px;
  }

  footer.note{
    text-align:center;
    font-size:11px;
    color:#a68888;
    margin-top:26px;
    line-height:1.7;
  }

  /* ---- detail screen ---- */
  .detail{
    display:none;
    flex-direction:column;
    align-items:center;
    text-align:center;
    animation:fadeIn .25s ease;
  }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }
  .detail.active{ display:flex; }
  .back{
    align-self:flex-start;
    background:none;
    border:1px solid var(--gold);
    color:var(--maroon);
    border-radius:999px;
    padding:6px 16px;
    font-size:13px;
    margin-bottom:18px;
    cursor:pointer;
  }
  .detail img.portrait-lg{
    width:110px;
    height:110px;
    border-radius:50%;
    border:3px solid var(--gold);
    object-fit:cover;
    margin-bottom:10px;
  }
  .detail .name{
    font-size:22px;
    font-weight:bold;
    color:var(--maroon);
  }
  .detail .tag{
    font-size:13px;
    color:var(--maroon);
    background:var(--pink1);
    border-radius:999px;
    padding:3px 14px;
    margin-top:6px;
    margin-bottom:20px;
    display:inline-block;
  }
  .qr-frame{
    background:#fff;
    border:2px solid var(--gold);
    border-radius:20px;
    padding:16px;
    box-shadow:0 4px 14px rgba(150,90,90,.12);
  }
  .qr-frame img{
    width:240px;
    height:240px;
    display:block;
    border-radius:8px;
  }
  .detail .howto{
    margin-top:18px;
    font-size:13px;
    color:#8a6b6b;
    line-height:1.8;
    max-width:280px;
  }
  #screen-home.hide{ display:none; }
</style>
</head>
<body>
<div class="app">

  <div id="screen-home">
    <header class="title">
      <span class="badge">STAFF MENU</span>
      <h1>運気上昇お茶会</h1>
      <p>担当を選んで、あなたのペースで<br>友だち追加をどうぞ</p>
    </header>

    <div class="list" id="list"></div>

    <footer class="note">
      それぞれのQRコードを1画面ずつ<br>ゆっくり読み取れます
    </footer>
  </div>

  <div id="detail-root"></div>

</div>

<script>
const STAFF = [
  { id:"junko",    name:"じゅんこ",   tag:"マヤ暦",                       type:"LINE" },
  { id:"eri",      name:"えりぃ",     tag:"気巡り体験☆引き寄せマスター", type:"LINE" },
  { id:"manamin",  name:"まなみん",   tag:"守護天使リーディング",         type:"LINE" },
  { id:"yukitama", name:"ゆきたま",   tag:"マンダラチャート",             type:"Instagram" },
  { id:"hinoe",    name:"ひのえ",     tag:"四柱推命",                     type:"LINE" },
];

const list = document.getElementById('list');
const detailRoot = document.getElementById('detail-root');
const home = document.getElementById('screen-home');

STAFF.forEach(s=>{
  const card = document.createElement('div');
  card.className = 'card';
  card.onclick = () => showDetail(s.id);
  card.innerHTML = `
    <img class="portrait" src="assets/portrait_${s.id}.png" alt="${s.name}">
    <div class="info">
      <div class="name">${s.name}</div>
      <span class="tag">${s.tag}</span>
    </div>
    <div class="arrow">›</div>
  `;
  list.appendChild(card);

  const detail = document.createElement('div');
  detail.className = 'detail';
  detail.id = `detail-${s.id}`;
  detail.innerHTML = `
    <button class="back" onclick="showHome()">← もどる</button>
    <img class="portrait-lg" src="assets/portrait_${s.id}.png" alt="${s.name}">
    <div class="name">${s.name}</div>
    <span class="tag">${s.tag}</span>
    <div class="qr-frame">
      <img src="assets/qr_${s.id}.png" alt="${s.name}の${s.type} QRコード">
    </div>
    <p class="howto">
      ${s.type === 'Instagram'
        ? 'カメラアプリでQRコードを読み取ると<br>Instagramのプロフィールに移動します'
        : 'カメラアプリでQRコードを読み取ると<br>LINEの友だち追加画面が開きます'}
    </p>
  `;
  detailRoot.appendChild(detail);
});

function showDetail(id){
  home.classList.add('hide');
  document.querySelectorAll('.detail').forEach(d=>d.classList.remove('active'));
  document.getElementById(`detail-${id}`).classList.add('active');
  window.scrollTo(0,0);
  history.pushState({id}, '', `#${id}`);
}
function showHome(){
  document.querySelectorAll('.detail').forEach(d=>d.classList.remove('active'));
  home.classList.remove('hide');
  window.scrollTo(0,0);
  history.pushState({}, '', location.pathname);
}
window.onpopstate = (e)=>{
  const id = location.hash.replace('#','');
  if(id && STAFF.some(s=>s.id===id)) showDetail(id);
  else showHome();
};
// deep link support (e.g. index.html#hinoe)
window.addEventListener('load', ()=>{
  const id = location.hash.replace('#','');
  if(id && STAFF.some(s=>s.id===id)) showDetail(id);
});
</script>
</body>
</html>
